{% extends 'base.html' %}
{% block title %}Upload Photo{% endblock %}
{% block content %}
<h2>Upload Classroom Photo</h2>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>
        <label>Subject ID</label><br>
        <input type="number" name="subject_id" required>
    </p>
    <p>
        <label>Date</label><br>
        <input type="date" name="date" required>
    </p>
    <p>
        <label>Session Number</label><br>
        <input type="number" name="session_number" value="1" min="1" max="8">
    </p>
    <p>
        <label>Classroom Photo</label><br>
        <input type="file" name="photo" accept="image/*" required>
    </p>
    <button class="btn" type="submit">Upload Photo</button>
</form>
{% endblock %}
