{% extends 'base.html' %}
{% block title %}Enroll Face{% endblock %}
{% block content %}
<h2>Enroll Student Face</h2>
{% if success %}<div class="success">Face enrollment successful.</div>{% endif %}
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>
        <label>Angle label</label><br>
        <input type="text" name="angle_label" value="front">
    </p>
    <p>
        <label>Upload photo</label><br>
        <input type="file" name="photo" accept="image/*" required>
    </p>
    <button class="btn" type="submit">Enroll Face</button>
</form>
{% endblock %}
