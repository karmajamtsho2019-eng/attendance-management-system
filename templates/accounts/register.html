{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}
{% block content %}
<h2>Create Teacher or Student Account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Create Account</button>
</form>
<p><a href="{% url 'login' %}">Back to login</a></p>
{% endblock %}
